name: 機能要望 / Feature request
description: 利用場面と必要な改善を提案します。
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい問題 / Problem
      description: どの環境・操作で困っているかを説明してください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望する動作 / Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 現在の回避方法 / Current workaround
